<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xlab Tickets</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            padding: 25px;
        }

        h1 {
            margin: 0 0 20px;
        }

        .topbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button,
        .button {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .back {
            background: #1976d2;
            color: white;
        }

        .export {
            background: #2e7d32;
            color: white;
        }

        .filters {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .filters h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select,
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            min-width: 200px;
        }

        .zoeken {
            background: #1976d2;
            color: white;
        }

        .reset {
            background: #666;
            color: white;
        }

        #melding {
            margin: 15px 0;
            font-weight: bold;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            min-width: 1700px;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #1f4e78;
            color: white;
            padding: 11px;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        th button {
            background: transparent;
            color: white;
            padding: 0;
            font-weight: bold;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f1f5f9;
        }

        .ticket-link {
            color: #1976d2;
            font-weight: bold;
            cursor: pointer;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
            background: #e8eef5;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        /* Detailvenster */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 10;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 10px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {margin: 0;
        }

        .close {
            background: #ddd;
            color: #222;
            font-size: 18px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .detail-item strong {
            display: block;
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-full {
            grid-column: 1 / -1;
            white-space: pre-wrap;
        }

        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .detail-full {
                grid-column: auto;
            }

            select,
            input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Xlab Tickets</h1>

    <div class="topbar">

        <a href="/" class="button back">
            ← Terug naar dashboard
        </a>

        <a href="/tickets/export" class="button export">
            ↓ Exporteren naar Excel
        </a>

    </div>


    <div class="filters">

        <h2>Tickets zoeken</h2>

        <div class="filter-row">

            <select id="status">
                <option value="">Alle statussen</option>
                <option value="New">Nieuw</option>
                <option value="Development">Development</option>
                <option value="Opgepakt">Opgepakt</option>
                <option value="Ter acceptatie">Ter acceptatie</option>
                <option value="Antwoord van opdrachtgever">
                    Antwoord van opdrachtgever
                </option>
                <option value="Vraag naar opdrachtgever">
                    Vraag naar opdrachtgever
                </option>
                <option value="Interne communicatie">
                    Interne communicatie
                </option>
                <option value="Geaccepteerd (gesloten)">
                    Geaccepteerd (gesloten)
                </option>
                <option value="Gesloten (anders)">
                    Gesloten (anders)
                </option>
            </select>

            <input
                type="text"
                id="organisatie"
                placeholder="Organisatie"
            >

            <input
                type="text"
                id="zoekterm"
                placeholder="Ticketnr, onderwerp of toelichting"
            >

            <button
                class="button zoeken"
                onclick="zoekTickets()"
            >
                Zoeken
            </button>

            <button
                class="button reset"
                onclick="resetFilters()"
            >
                Reset
            </button>

        </div>

    </div>


    <div id="melding">
        Tickets worden geladen...
    </div>


    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>dossier_id</th>
                    <th>Status</th>
                    <th>Ticketnr</th>
                    <th>Gewijzigd</th>
                    <th>Soort ticket</th>
                    <th>Aangemeld door</th>
                    <th>Onderwerp</th>
                    <th>Omgeving</th>
                    <th>Prio</th>
                    <th>Impact</th>
                    <th>Datum</th>
                    <th>Toelichting</th>
                    <th>Organisatie</th>
                    <th>created_by</th>
                    <th>created_at</th>
                    <th>modified_by</th>
                    <th>modified_at</th>
                </tr>
            </thead>

            <tbody id="ticketTabel"></tbody>

        </table>

    </div>

</div>


<!-- DETAILVENSTER -->

<div class="modal" id="detailModal">

    <div class="modal-content">
        <div class="modal-header">

            <h2>Ticket details</h2>

            <button
                class="button close"
                onclick="sluitDetails()"
            >
                ✕
            </button>

        </div>

        <div
            class="details"
            id="ticketDetails"
        ></div>

    </div>

</div>


<script>

    let huidigeTickets = [];


    function toonStatus(status) {

        if (status === "New") {
            return "Nieuw";
        }

        return status ?? "";
    }


    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    async function laadTickets(url = "/tickets") {

        const tabel =
            document.getElementById("ticketTabel");

        const melding =
            document.getElementById("melding");

        tabel.innerHTML = "";

        melding.textContent =
            "Tickets worden geladen...";


        try {

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error("Tickets konden niet worden geladen.");
            }

            const tickets =
                await response.json();

            huidigeTickets = tickets;

            toonTickets(tickets);

        } catch (error) {

            console.error(error);

            melding.textContent =
                "Fout bij het laden van de tickets.";

        }
    }


    function toonTickets(tickets) {

        const tabel =
            document.getElementById("ticketTabel");

        const melding =
            document.getElementById("melding");

        tabel.innerHTML = "";


        if (tickets.length === 0) {

            tabel.innerHTML = `
                <tr>
                    <td colspan="17" class="empty">
                        Geen tickets gevonden.
                    </td>
                </tr>
            `;

            melding.textContent =
                "Geen tickets gevonden.";

            return;
        }


        tickets.forEach(function(ticket, index) {

            const rij =
                document.createElement("tr");


            rij.innerHTML = `

                <td>
                    ${escapeHtml(ticket.dossier_id)}
                </td>

                <td>
                    <span class="status-badge">
                        ${escapeHtml(
                            toonStatus(ticket.status)
                        )}
                    </span>
                </td>

                <td>
                    <span
                        class="ticket-link"
                        onclick="toonDetails(${index})"
                    >
                        ${escapeHtml(ticket.ticketnr)}
                    </span>
                </td>

                <td>${escapeHtml(ticket.gewijzigd)}</td>

                <td>${escapeHtml(ticket.soort_ticket)}</td>

                <td>${escapeHtml(ticket.aangemeld_door)}</td>

                <td>${escapeHtml(ticket.onderwerp)}</td>

                <td>${escapeHtml(ticket.omgeving)}</td>

                <td>${escapeHtml(ticket.prio)}</td>

                <td>${escapeHtml(ticket.impact)}</td>

                <td>${escapeHtml(ticket.datum)}</td>

                <td>${escapeHtml(ticket.toelichting)}</td>

                <td>${escapeHtml(ticket.organisatie)}</td>

                <td>${escapeHtml(ticket.created_by)}</td>

                <td>${escapeHtml(ticket.created_at)}</td>

                <td>${escapeHtml(ticket.modified_by)}</td>

                <td>${escapeHtml(ticket.modified_at)}</td>

            `;

            tabel.appendChild(rij);

        });


        melding.textContent =
            tickets.length + " tickets gevonden.";
    }


    async function zoekTickets() {

        const status =
            document.
            getElementById("status").value;

        const organisatie =
            document
                .getElementById("organisatie")
                .value
                .trim();

        const zoekterm =
            document
                .getElementById("zoekterm")
                .value
                .trim();


        const parameters =
            new URLSearchParams();


        if (status) {
            parameters.append(
                "status",
                status
            );
        }


        if (organisatie) {
            parameters.append(
                "organisatie",
                organisatie
            );
        }


        if (zoekterm) {
            parameters.append(
                "zoekterm",
                zoekterm
            );
        }


        let url =
            "/tickets/search";


        if (parameters.toString()) {

            url +=
                "?" +
                parameters.toString();

        }


        await laadTickets(url);
    }


    function resetFilters() {

        document.getElementById("status").value = "";

        document.getElementById("organisatie").value = "";

        document.getElementById("zoekterm").value = "";

        laadTickets("/tickets");
    }


    function toonDetails(index) {

        const ticket =
            huidigeTickets[index];

        if (!ticket) {
            return;
        }


        const details =
            document.getElementById("ticketDetails");


        details.innerHTML = `

            <div class="detail-item">
                <strong>Dossier ID</strong>
                ${escapeHtml(ticket.dossier_id)}
            </div>

            <div class="detail-item">
                <strong>Ticketnummer</strong>
                ${escapeHtml(ticket.ticketnr)}
            </div>

            <div class="detail-item">
                <strong>Status</strong>
                ${escapeHtml(toonStatus(ticket.status))}
            </div>

            <div class="detail-item">
                <strong>Soort ticket</strong>
                ${escapeHtml(ticket.soort_ticket)}
            </div>

            <div class="detail-item">
                <strong>Aangemeld door</strong>
                ${escapeHtml(ticket.aangemeld_door)}
            </div>

            <div class="detail-item">
                <strong>Organisatie</strong>
                ${escapeHtml(ticket.organisatie)}
            </div>

            <div class="detail-item">
                <strong>Omgeving</strong>
                ${escapeHtml(ticket.omgeving)}
            </div>

            <div class="detail-item">
                <strong>Prioriteit</strong>
                ${escapeHtml(ticket.prio)}
            </div>

            <div class="detail-item">
                <strong>Impact</strong>
                ${escapeHtml(ticket.impact)}
            </div>

            <div class="detail-item">
                <strong>Datum</strong>
                ${escapeHtml(ticket.datum)}
            </div>

            <div class="detail-item">
                <strong>Gewijzigd</strong>
                ${escapeHtml(ticket.gewijzigd)}
            </div>

            <div class="detail-item">
                <strong>Created by</strong>
                ${escapeHtml(ticket.created_by)}
            </div>

            <div class="detail-item">
                <strong>Created at</strong>
                ${escapeHtml(ticket.created_at)}
            </div>

            <div class="detail-item">
                <strong>Modified by</strong>
                ${escapeHtml(ticket.modified_by)}
            </div>

            <div class="detail-item">
                <strong>Modified at</strong>
                ${escapeHtml(ticket.modified_at)}
            </div>

            <div class="detail-item detail-full">
                <strong>Onderwerp</strong>
                ${escapeHtml(ticket.onderwerp)}
            </div>

            <div class="detail-item detail-full">
                <strong>Toelichting</strong>
                ${escapeHtml(ticket.toelichting)}
                </div>

        `;


        document.getElementById("detailModal").style.display =
            "flex";
    }


    function sluitDetails() {

        document.getElementById("detailModal").style.display =
            "none";
    }


    document
        .getElementById("detailModal")
        .addEventListener("click", function(event) {

            if (event.target === this) {
                sluitDetails();
            }

        });


    document
        .getElementById("zoekterm")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                zoekTickets();
            }

        });


    laadTickets();

</script>

</body>
</html>
